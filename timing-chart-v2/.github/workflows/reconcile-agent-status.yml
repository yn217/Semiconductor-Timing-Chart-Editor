name: Reconcile agent status

on:
  issues:
    types: [opened, closed, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - '.agents/PLAN.yaml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: reconcile-agent-status
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event_name != 'push' || (github.event.head_commit.message != '' && !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
          CODEX_CONTROL_SHA: unknown
        run: npm run reconcile:agent-status
      - name: Commit generated snapshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agents/STATUS.json .codex/ISSUE_ORDER.txt .codex/AGENT_ASSIGNMENT.md docs/PROJECT_STATUS.md
          git diff --cached --quiet || git commit -m "chore(agents): reconcile live project status [skip ci]"
          git push
