name: Architecture Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Deliberately fail after the quality gate for failure-path verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: architecture-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-gate:
    name: Architecture Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repository checks
        run: npm run check

      - name: Run approved dependency audit
        run: npm audit --audit-level=high --omit=optional

      - name: Run Chromium browser acceptance
        run: npm run test:e2e

      - name: Verify deliberate failure path
        if: ${{ inputs.force_failure == true }}
        run: |
          echo "Deliberate failure requested for Architecture Gate verification."
          exit 1
