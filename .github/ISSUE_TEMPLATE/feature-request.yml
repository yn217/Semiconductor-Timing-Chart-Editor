name: Feature request
description: Propose a product capability or planned improvement (not a defect report).
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: user-need
    attributes:
      label: User need / problem
      description: Who needs this, and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Describe the desired user-visible capability without prescribing unnecessary internals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and relevant data, history, accessibility, or performance constraints.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References / context
      description: Add screenshots, related issues, constraints, or enter N/A with a reason.
    validations:
      required: true
