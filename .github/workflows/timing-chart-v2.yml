name: Timing Chart V2 Architecture Gate

on:
  workflow_dispatch:
    inputs:
      performance_scale:
        description: Performance suite to run
        type: choice
        options: [pr, nightly]
        default: pr
      deliberate_failure:
        description: Intentionally fail after the full PR gate to verify enforcement
        type: boolean
        required: false
        default: false
      update_visual_baselines:
        description: Regenerate visual-regression-modes.spec.ts screenshot baselines on this runner's platform (Linux) and upload them as an artifact instead of running the normal PR gate
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "23 17 * * *"
  push:
    branches: [main]
    paths: ["timing-chart-v2/**", ".github/workflows/timing-chart-v2.yml"]
  pull_request:
    paths: ["timing-chart-v2/**", ".github/workflows/timing-chart-v2.yml"]

# Least privilege: the gate only reads the repository (artifact upload uses the run token, not repo write).
permissions:
  contents: read

jobs:
  visual-baseline-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timing-chart-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timing-chart-v2/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/visual-regression-modes.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: visual-regression-baselines
          path: timing-chart-v2/tests/e2e/visual-regression-modes.spec.ts-snapshots
          retention-days: 7

  pr-gate:
    if: github.event_name != 'schedule' && inputs.performance_scale != 'nightly' && inputs.update_visual_baselines != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timing-chart-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timing-chart-v2/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Deliberate failure enforcement probe
        if: inputs.deliberate_failure == true
        run: |
          echo "Deliberate failure probe requested; the quality gate must fail."
          exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: timing-chart-v2-pr-traces
          path: timing-chart-v2/test-results
          retention-days: 2

  nightly-performance:
    if: github.event_name == 'schedule' || inputs.performance_scale == 'nightly'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timing-chart-v2
    env:
      PERF_SCALE: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timing-chart-v2/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:perf:nightly
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: timing-chart-v2-nightly-traces
          path: timing-chart-v2/test-results
          retention-days: 7
