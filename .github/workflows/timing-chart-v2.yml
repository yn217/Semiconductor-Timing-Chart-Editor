name: Timing Chart V2 Architecture Gate

on:
  workflow_dispatch:
    inputs:
      performance_scale:
        description: Performance suite to run
        type: choice
        options: [pr, nightly]
        default: pr
  schedule:
    - cron: "23 17 * * *"
  push:
    branches: [rewrite/v2]
    paths: ["timing-chart-v2/**", ".github/workflows/timing-chart-v2.yml"]
  pull_request:
    paths: ["timing-chart-v2/**", ".github/workflows/timing-chart-v2.yml"]

jobs:
  pr-gate:
    if: github.event_name != 'schedule' && inputs.performance_scale != 'nightly'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timing-chart-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timing-chart-v2/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: timing-chart-v2-pr-traces
          path: timing-chart-v2/test-results

  nightly-performance:
    if: github.event_name == 'schedule' || inputs.performance_scale == 'nightly'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timing-chart-v2
    env:
      PERF_SCALE: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timing-chart-v2/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:perf:nightly
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: timing-chart-v2-nightly-traces
          path: timing-chart-v2/test-results
