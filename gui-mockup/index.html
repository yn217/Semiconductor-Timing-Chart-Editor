<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timing Chart Editor</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="wavedrom-overlay.css"></head>
<body>
<main class="app" data-testid="timing-editor">
  <header class="window-header"><div class="app-icon">∿</div><strong>Timing Chart Editor</strong><span id="dirtyState">Saved</span><div class="window-actions">− □ ×</div></header>
  <nav class="menu-tabs" aria-label="Application menu"><button class="menu-tab">ファイル</button><button class="menu-tab active">ホーム</button><button class="menu-tab">挿入</button><button class="menu-tab">注釈</button><button class="menu-tab">表示</button><button class="menu-tab">AI</button></nav>
  <section class="ribbon" aria-label="Ribbon commands">
    <div class="ribbon-group"><div class="ribbon-actions"><button id="newDocument">新規</button><button id="openDocument">開く</button><button id="saveDocument">保存</button></div><span>ファイル</span><input id="fileInput" type="file" accept=".tcd,.json,application/json" hidden></div>
    <div class="ribbon-group"><div class="ribbon-actions"><button id="undo">↶</button><button id="redo">↷</button></div><span>編集</span></div>
    <div class="ribbon-group wide"><div class="ribbon-actions"><button id="addSignal">＋ 信号</button><button id="addGroup">＋ グループ</button><button id="addSpacer">＋ Spacer</button><button id="addTransaction">＋ Transaction</button></div><span>信号・構造</span></div>
    <div class="ribbon-group wide"><div class="ribbon-actions"><button id="addAnnotation">Text / Range</button><button id="addEdge">Dependency Arrow</button><button id="snapAnchors">Snap Anchors</button></div><span>注釈・依存関係</span></div>
    <div class="ribbon-group"><div class="ribbon-actions"><button id="insertCycle">＋ Cycle</button><button id="deleteCycle">− Cycle</button></div><span>時間軸</span></div>
    <div class="ribbon-group"><div class="ribbon-actions"><label class="ribbon-field">View<select id="viewMode"><option value="cycle">Cycle</option><option value="transaction">Transaction</option><option value="split">Split</option></select></label><label class="ribbon-field">Zoom<input id="zoom" type="range" min="0.5" max="2" step="0.1" value="1"></label></div><span>表示</span></div>
    <div class="ribbon-group export-group"><div class="ribbon-actions"><button id="exportSvg">SVG</button><button id="exportPng">PNG</button><button id="exportPdf">PDF</button></div><span>出力</span></div>
  </section>
  <section class="document-bar"><input id="documentTitle" value="Read Timing" aria-label="Document title"><input id="documentSubtitle" placeholder="Subtitle" aria-label="Document subtitle"><input id="documentFigure" placeholder="Figure 1" aria-label="Figure number"><input id="documentRevision" placeholder="Rev. A" aria-label="Revision"><span id="documentSummary">10 cycles · 6 signals</span></section>
  <div class="workspace">
    <aside class="signal-tree" data-testid="signal-tree"><div class="pane-title"><h2>信号 / グループ</h2><button id="collapseGroups">⋯</button></div><div class="tree-search">⌕　信号を検索…</div><div id="treeContent"></div><button class="add-group-footer" id="addGroupFooter">＋ グループを追加</button></aside>
    <section class="center-column">
      <section class="canvas-pane"><div class="canvas-scroll"><div id="waveformCanvas" class="waveform-canvas" data-testid="waveform-canvas"></div></div><div id="legend" class="legend" data-testid="legend"></div></section>
      <section class="bottom"><nav class="tabs" aria-label="Bottom editor"><button data-tab="signal">Signal</button><button data-tab="annotation">Annotation</button><button data-tab="problems">Problems <span id="problemCount"></span></button><button data-tab="json">JSON</button><button data-tab="transaction">Transaction</button><label class="follow"><input id="followSelection" type="checkbox" checked> Follow Selection</label><button id="pinSelection">Pin</button></nav><div id="bottomContent" class="bottom-content"></div></section>
    </section>
    <aside class="inspector" data-testid="inspector"><div class="pane-title"><h2>オブジェクトのプロパティ</h2><span id="selectionKind">Document</span></div><div id="inspectorContent"></div></aside>
  </div>
  <footer class="status"><span id="statusText">Ready</span><span>Semantic model · WaveDrom/default skin · SVG geometry</span></footer>
</main><script src="vendor/wavedrom.min.js"></script><script src="vendor/waveskin-default.js"></script><script src="geometry.js"></script><script src="wavedrom-adapter.js"></script><script src="app.js"></script>
</body></html>
